name: Stage 3C mathematical replay
on:
  push:
    branches: [research/stage3c-math-before-hosts]
    paths:
      - 'research/stage3c/**/*.py'
      - 'research/stage3c/**/*.json'
      - '.github/workflows/stage3c-mathematical-replay.yml'
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy==2.3.5 scipy==1.17.0
      - name: Repeat seven studies and compare all recorded JSON fields
        run: python -B research/stage3c/verify.py --repo .
      - name: Reproduce seven independent Work submissions
        run: python -B research/stage3c/verify.py --repo . --work
